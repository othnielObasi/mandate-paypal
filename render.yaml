# One-click deploy: https://render.com/deploy?repo=https://github.com/othnielObasi/mandate-paypal
# Leave any key blank to run that part in offline demo mode (simulated payments,
# offline planner, simulated market prices). Add keys later under Environment.
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The model: Muse Spark on the Meta Model API (MODEL_API_KEY), or Claude (ANTHROPIC_API_KEY).
      - key: MANDATE_LLM
        value: meta
      - key: MANDATE_MODEL
        value: muse-spark-1.3
      - key: MODEL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Persistence: a Render Postgres internal URL, and the key that signs receipts and permits.
      - key: DATABASE_URL
        sync: false
      - key: MANDATE_SIGNING_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ZAPIER_HOOK_URL
        sync: false
      # Render generates a random secret; copy it into the Zap that pulls the kill switch.
      - key: AUTOMATION_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_PER_HOUR
        value: "400"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
