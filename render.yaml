# One-click deploy: https://render.com/deploy?repo=https://github.com/othnielObasi/mandate-paypal
# Leave any key blank to run that part in offline demo mode (simulated payments,
# offline planner, simulated market prices). Add keys later under Environment.
services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_PER_HOUR
        value: "400"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
