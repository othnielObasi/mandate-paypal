name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runs the store contract and restart tests against real Postgres too.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mandate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google's AP2 reference SDK, pinned, for the interop tests in tests/ap2v2.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          git clone https://github.com/google-agentic-commerce/AP2 /tmp/ap2
          git -C /tmp/ap2 checkout e1ea56db72a6385bce3e5c1112b3a56ce60acb43
          python -m venv /tmp/ap2venv && /tmp/ap2venv/bin/pip install -q -e /tmp/ap2
          echo "AP2_PYTHON=/tmp/ap2venv/bin/python" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The Postman collection (postman/) against the built app: 15 requests, 42 assertions.
      - name: Postman collection
        env:
          RATE_LIMIT_PER_MINUTE: "1000"
        run: |
          npx next start -p 3000 &
          for i in $(seq 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          npx -y newman@6.2.1 run postman/Mandate.postman_collection.json --env-var baseUrl=http://localhost:3000
          kill %1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
